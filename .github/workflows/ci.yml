name: RetroPack CI / Verification Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**", "v**", "v*" ]
  pull_request:
    branches: [ main, master, "v**", "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Run Multi-Module Unit Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Core Module Unit & Conformance Tests
        run: |
          ./gradlew :core:test --stacktrace || {
            echo "::error::Core unit tests failed!"
            find core/build/test-results/test -name "TEST-*.xml" -exec grep -Hn "failure\|error" {} + || true
            exit 1
          }

      - name: Runtime Bedrock Tests
        run: |
          ./gradlew :runtime:retropack-runtime-mgba:test --stacktrace || {
            echo "::error::Runtime bedrock tests failed!"
            find runtime/retropack-runtime-mgba/build/test-results/test -name "TEST-*.xml" -exec grep -Hn "failure\|error" {} + || true
            exit 1
          }

      - name: Template APK Invariant Tests
        run: |
          ./gradlew :template-apk:test --stacktrace || {
            echo "::error::Template APK tests failed!"
            find template-apk/build/test-results/test -name "TEST-*.xml" -exec grep -Hn "failure\|error" {} + || true
            exit 1
          }

      - name: Manager App UI & ViewModel Tests
        run: |
          ./gradlew :app:test --stacktrace || {
            echo "::error::Manager App tests failed!"
            find app/build/test-results/test -name "TEST-*.xml" -exec grep -Hn "failure\|error" {} + || true
            exit 1
          }

      - name: Upload Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            core/build/reports/tests/
            runtime/retropack-runtime-mgba/build/reports/tests/
            template-apk/build/reports/tests/
            app/build/reports/tests/
            build/reports/
          if-no-files-found: ignore
