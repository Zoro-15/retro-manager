name: Android CI

on:
  push:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  pull_request:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android APK/AAR Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages (API 35, NDK r28+, CMake 3.22.1)
        run: |
          sdkmanager --install "platforms;android-35" "platform-tools" "build-tools;35.0.0" "cmake;3.22.1"
          NDK_PKG="$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;28\.[0-9.]+' | sort -uV | tail -n 1)"
          if [ -z "$NDK_PKG" ]; then
            echo "::error::No NDK r28.x revision found in the SDK channel"
            exit 1
          fi
          echo "Installing $NDK_PKG ..."
          sdkmanager --install "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          sdkmanager --licenses > /dev/null <<< "y"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make gradlew and scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/*.py || true

      - name: Compile Native Engine (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p native_engine/build_arm64
          cd native_engine/build_arm64
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build . --config Release --parallel $(nproc)
          
          mkdir -p ../build
          cp libretro_engine.so ../build/libretro_engine.so

      - name: Fetch Libretro Cores (arm64-v8a)
        run: |
          set -euo pipefail
          python3 scripts/fetch_libretro_cores.py --abis arm64-v8a

      - name: Assemble Base Template APKs
        run: |
          set -euo pipefail
          python3 scripts/assemble_base_templates.py

      - name: Rotate Trust Anchors
        run: |
          set -euo pipefail
          python3 scripts/rotate_trust_anchors.py

      - name: Build Android Manager APK & Run Core Tests
        run: ./gradlew :app:assembleDebug :core:test --stacktrace

      - name: Upload Manager APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
