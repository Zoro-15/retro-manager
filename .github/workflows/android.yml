name: Android CI

on:
  push:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  pull_request:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android APK/AAR Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages (API 35, NDK r28+, CMake 3.22.1)
        run: |
          sdkmanager --install "platforms;android-35" "platform-tools" "build-tools;35.0.0" "cmake;3.22.1"
          NDK_PKG="$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;28\.[0-9.]+' | sort -uV | tail -n 1)"
          if [ -z "$NDK_PKG" ]; then
            echo "::error::No NDK r28.x revision found in the SDK channel"
            exit 1
          fi
          echo "Installing $NDK_PKG ..."
          sdkmanager --install "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          sdkmanager --licenses > /dev/null <<< "y"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android Manager APK & Run Core Tests
        run: ./gradlew :app:assembleDebug :core:test --stacktrace

      - name: Upload Manager APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
