name: Android CI

on:
  push:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  pull_request:
    branches: [main, master, v2]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "nano/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android APK/AAR Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules (canonical mGBA, MPL-2.0, untouched)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages (API 35, NDK r28+, CMake 3.22.1)
        run: |
          sdkmanager --install "platforms;android-35" "platform-tools" "build-tools;35.0.0" "cmake;3.22.1"
          NDK_PKG="$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;28\.[0-9.]+' | sort -uV | tail -n 1)"
          if [ -z "$NDK_PKG" ]; then
            echo "::error::No NDK r28.x revision found in the SDK channel"
            exit 1
          fi
          echo "Installing $NDK_PKG ..."
          sdkmanager --install "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          sdkmanager --licenses > /dev/null <<< "y"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble runtime AAR (NDK/CMake/mGBA compile gate)
        run: ./gradlew :runtime:retropack-runtime-common:assembleDebug :runtime:retropack-runtime-mgba:assembleDebug :runtime:retropack-runtime-snes9x:assembleDebug :runtime:retropack-runtime-genesis:assembleDebug :runtime:retropack-runtime-fceumm:assembleDebug :runtime:retropack-runtime-pce:assembleDebug :runtime:retropack-runtime-fbneo:assembleDebug :runtime:retropack-runtime-pcsx:assembleDebug :runtime:retropack-runtime-mupen64:assembleDebug :runtime:retropack-runtime-ppsspp:assembleDebug :runtime:retropack-runtime-melonds:assembleDebug --stacktrace

      - name: Upload runtime AAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-aar-debug
          path: runtime/*/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Assemble Template APK
        run: ./gradlew :template-apk:assembleDebug --stacktrace

      - name: Upload Template APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-apk-debug
          path: template-apk/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Verify 16 KB Page-Size ELF Alignment (Android 15/16 Gate)
        run: |
          chmod +x scripts/verify-16kb-alignment.sh
          ./scripts/verify-16kb-alignment.sh

      - name: Stage Fresh Template APK and Rotate Trust Anchors
        run: |
          cp template-apk/build/outputs/apk/debug/*.apk runtimes/mgba-unified/template.apk
          chmod +x scripts/rotate-trust-anchors.sh
          ./scripts/rotate-trust-anchors.sh


      - name: Assemble Manager APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The manager APK embeds ${rootDir}/runtimes as assets. If the pinned
      # bundle is missing (gitignore regression, deleted template, stale
      # checkout), every in-app 'retropack transform' fails at Stage 2 with
      # "No runtime template registered for ID: 'mgba-unified'". This gate
      # inspects the FINAL packaged APK so that class of failure can never
      # ship again.
      - name: Verify Manager APK embeds all pinned runtime bundle descriptors
        run: |
          MANAGER_APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "Inspecting $MANAGER_APK"
          unzip -l "$MANAGER_APK" > /tmp/manager-apk-entries.txt
          cat /tmp/manager-apk-entries.txt
          for REQUIRED in \
            "assets/mgba-unified/template.apk" \
            "assets/mgba-unified/runtime.json" \
            "assets/snes9x-unified/runtime.json" \
            "assets/genesis-unified/runtime.json" \
            "assets/fceumm-unified/runtime.json" \
            "assets/pce-unified/runtime.json" \
            "assets/fbneo-unified/runtime.json" \
            "assets/pcsx-unified/runtime.json" \
            "assets/mupen64-unified/runtime.json" \
            "assets/ppsspp-unified/runtime.json" \
            "assets/melonds-unified/runtime.json" ; do
            if ! grep -q "$REQUIRED" /tmp/manager-apk-entries.txt ; then
              echo "::error::Manager APK is missing $REQUIRED — the pinned runtime bundle was not embedded."
              exit 1
            fi
          done
          echo "All 10 pinned runtime bundle descriptors verified inside Manager APK."


      - name: Run Android unit tests (app + template-apk)
        run: ./gradlew :app:testDebugUnitTest :template-apk:testDebugUnitTest --stacktrace

      - name: Upload Manager APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
