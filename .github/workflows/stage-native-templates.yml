name: Stage Native Templates

# Builds pure C++ native_engine, fetches 16 KB-aligned Libretro cores,
# and packages the 5 universal zero-code NativeActivity base template APKs.

on:
  push:
    branches: [main, master, v2]
    paths:
      - "native_engine/**"
      - "runtimes/**"
      - "scripts/assemble_base_templates.py"
      - "scripts/fetch_libretro_cores.py"
      - "scripts/verify_core_alignment.py"
      - ".github/workflows/stage-native-templates.yml"
  pull_request:
    branches: [main, master, v2]
    paths:
      - "native_engine/**"
      - "runtimes/**"
      - "scripts/assemble_base_templates.py"
      - "scripts/fetch_libretro_cores.py"
      - "scripts/verify_core_alignment.py"
      - ".github/workflows/stage-native-templates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-stage-templates:
    name: Build Native Engine & Assemble Base Templates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages & NDK r28+
        run: |
          sdkmanager --install "platforms;android-35" "platform-tools" "build-tools;35.0.0" "cmake;3.22.1"
          NDK_PKG="$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;28\.[0-9.]+' | sort -uV | tail -n 1)"
          if [ -z "$NDK_PKG" ]; then
            echo "::error::No NDK r28.x revision found in the SDK channel"
            exit 1
          fi
          echo "Installing $NDK_PKG ..."
          sdkmanager --install "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          sdkmanager --licenses > /dev/null <<< "y"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Compile Native Engine (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p native_engine/build_arm64
          cd native_engine/build_arm64
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build . --config Release --parallel $(nproc)
          
          mkdir -p ../build
          cp libretro_engine.so ../build/libretro_engine.so

      - name: Fetch Libretro Cores
        run: |
          set -euo pipefail
          chmod +x scripts/*.py
          python3 scripts/fetch_libretro_cores.py --abis arm64-v8a

      - name: Assemble Universal Base Template APKs
        run: |
          set -euo pipefail
          python3 scripts/assemble_base_templates.py

      - name: Verify 16 KB Page Alignment & Congruence
        run: |
          set -euo pipefail
          python3 scripts/verify_core_alignment.py runtimes \
            --manifest runtimes/cores.json \
            --strict \
            --verbose

      - name: Verify Zero-Bytecode Invariant (No DEX in templates)
        run: |
          set -euo pipefail
          for apk in runtimes/*-unified/template.apk; do
            echo "Inspecting $apk for DEX bytecode..."
            if unzip -l "$apk" | grep -E '\.dex$' > /dev/null; then
              echo "ERROR: Found DEX bytecode in pure NativeActivity template $apk"
              exit 1
            fi
            echo "PASS: $apk contains 0 classes.dex"
          done

      - name: Upload Universal Base Templates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropack-native-base-templates
          path: |
            runtimes/*-unified/template.apk
            runtimes/*-unified/runtime.json
          if-no-files-found: error
          retention-days: 30
